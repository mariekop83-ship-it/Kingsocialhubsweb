<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Websites for sale - King Social Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/favicon.png">
<script>
  // same theme the dashboard uses (saved choice, otherwise dark like the dashboard default)
  (function(){
    var t='dark';
    try{var s=localStorage.getItem('ksl_theme');if(s==='light'||s==='dark')t=s;}catch(e){}
    document.documentElement.setAttribute('data-theme',t);
  })();
</script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --blue:#16a34a;--blue2:#15803d;--blue-light:#eef4ff;
    --bg:#f7f7fb;--white:#fff;--text:#15151f;--text2:#55556e;--text3:#8b8ba3;
    --border:#e2e2ec;--shadow:0 1px 4px rgba(0,0,0,.08);--radius:14px;--radius-sm:10px;
  }
  html[data-theme="dark"]{--bg:#08080f;--white:#131320;--text:#eeeef5;--text2:#8888a8;--text3:#55557a;--border:#252535;--blue-light:#182238}
  html,body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a{text-decoration:none;color:inherit}
  .shell{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:40px}
  .top{display:flex;align-items:center;gap:10px;padding:16px;background:var(--white);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
  .top a.back{font-size:22px;line-height:1;padding:2px 8px 4px 0;color:var(--text2)}
  .top b{font-size:17px;font-weight:800}
  .intro{margin:14px 16px 0;font-size:13px;line-height:1.55;color:var(--text2)}
  .list{padding:0 16px}
  .card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-top:14px;overflow:hidden}
  .shot{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--bg)}
  .ph{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:16/9;font-size:44px;background:linear-gradient(135deg,var(--blue),#0f766e)}
  .body{padding:14px 16px 16px}
  .row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  h3{font-size:16px;font-weight:800;line-height:1.3}
  .price{font-size:16px;font-weight:800;color:var(--blue);white-space:nowrap}
  .desc{margin-top:6px;font-size:13px;line-height:1.55;color:var(--text2);white-space:pre-line}
  .note{margin-top:10px;padding:9px 11px;border-radius:var(--radius-sm);background:var(--bg);border:1px dashed var(--border);font-size:12px;line-height:1.5;color:var(--text2);white-space:pre-line}
  .note b{color:var(--text)}
  .btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;border-radius:12px;font-size:13.5px;font-weight:700;border:1.5px solid var(--blue);cursor:pointer;font-family:inherit;text-align:center}
  .btn.p{background:var(--blue);color:#fff}
  .btn.o{background:transparent;color:var(--blue)}
  .btn.t{background:#229ED9;border-color:#229ED9;color:#fff}
  .btn.off{opacity:.5;pointer-events:none}
  .tag{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:99px;font-size:10.5px;font-weight:800;background:#ef4444;color:#fff;vertical-align:middle}
  .empty{margin:30px 16px;text-align:center;color:var(--text2);font-size:13.5px;line-height:1.6}
  .empty .big{font-size:40px;margin-bottom:6px}
  .skel{height:260px;margin-top:14px;border-radius:var(--radius);background:var(--white);border:1px solid var(--border);animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.5}}
</style>
</head>
<body>
<div class="shell">
  <div class="top"><a class="back" href="/dashboard" aria-label="Back">&lsaquo;</a><b>Websites for sale</b></div>
  <p class="intro">Tap <b>View customer panel</b> to open a live demo of each website and see exactly how it looks and works before you buy.</p>
  <div class="list" id="list"><div class="skel"></div><div class="skel"></div></div>
</div>
<script>
(function(){
  var list=document.getElementById('list');
  var BUY='https://t.me/kingsocialhub';
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function safe(u){u=String(u||'');return /^https?:\/\//i.test(u)?u:'';}
  function naira(n){return '₦'+Number(n||0).toLocaleString('en-NG');}
  function card(w){
    var img=safe(w.imageUrl);
    var h='<div class="card">';
    h+=img?'<img class="shot" loading="lazy" alt="" src="'+esc(img)+'" onerror="this.outerHTML=\'<div class=ph>&#127760;</div>\'">':'<div class="ph">&#127760;</div>';
    h+='<div class="body"><div class="row"><h3>'+esc(w.title)+(w.sold?'<span class="tag">SOLD</span>':'')+'</h3><span class="price">'+naira(w.price)+'</span></div>';
    if(w.description)h+='<div class="desc">'+esc(w.description)+'</div>';
    if(w.demoNote)h+='<div class="note"><b>Demo details:</b>\n'+esc(w.demoNote)+'</div>';
    h+='<div class="btns">';
    if(safe(w.customerPanelUrl))h+='<a class="btn p" target="_blank" rel="noopener noreferrer" href="'+esc(safe(w.customerPanelUrl))+'">&#128065; View customer panel</a>';
    if(safe(w.adminPanelUrl))h+='<a class="btn o" target="_blank" rel="noopener noreferrer" href="'+esc(safe(w.adminPanelUrl))+'">&#128274; View admin panel</a>';
    h+=w.sold?'<span class="btn t off">Sold</span>':'<a class="btn t" target="_blank" rel="noopener noreferrer" href="'+BUY+'">Buy / ask about this website</a>';
    return h+'</div></div></div>';
  }
  fetch('/api/websites',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){
    if(!Array.isArray(d)||!d.length){
      list.innerHTML='<div class="empty"><div class="big">&#127760;</div>No websites available right now.<br>Check back soon, or DM us if you want a website built for you.</div>';
      return;
    }
    list.innerHTML=d.map(card).join('');
  }).catch(function(){
    list.innerHTML='<div class="empty">Could not load websites. Please refresh the page.</div>';
  });
})();
</script>
</body>
</html>
