<!DOCTYPE html><html lang="en"><head>
  <link rel="icon" type="image/png" href="/favicon.png"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buy Number 2 | King Social Hub</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/theme.css"><script src="/js/king-ui.js?v=1"></script><link rel="stylesheet" href="/brand.css"><style>body{padding:18px}.wrap{max-width:900px;margin:22px auto}.panel{background:var(--card,#15151d);border:1px solid var(--border2,#333);border-radius:16px;padding:18px;margin:14px 0}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}label{display:block;font-weight:700;margin:8px 0}select,input,button{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--border2,#444);background:var(--card2,#20202a);color:inherit}button{cursor:pointer;background:var(--gold,#16a34a);border:0;font-weight:800}.muted{opacity:.72;font-size:13px}.order{border-top:1px solid var(--border2,#333);padding:12px 0;overflow-wrap:anywhere}.status{font-weight:800}.code{font-size:22px;letter-spacing:2px;font-weight:900}.danger{background:#8b2525}.msg{padding:10px;border-radius:9px;margin:10px 0;background:var(--card2,#222)}a{color:var(--gold,#16a34a)}.order.active-order{border:1px solid var(--border2,#3a3a48);border-radius:17px;padding:16px;margin:12px 0;background:linear-gradient(145deg,rgba(22,163,74,.08),var(--card,#15151d));box-shadow:0 12px 30px #0002}.order-light{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:900;letter-spacing:.08em;margin-bottom:10px;color:#ff4757}.led{width:10px;height:10px;border-radius:50%;background:#ff4757;box-shadow:0 0 0 0 #ff475766;animation:otpPulse 1.2s infinite}.order-light.received{color:#16a34a}.order-light.received .led{background:#16a34a;box-shadow:0 0 14px #16a34a;animation:none}.order-phone{font-size:clamp(22px,5vw,30px);font-weight:900;overflow-wrap:anywhere;margin:8px 0}.order-timer{font-size:28px;font-weight:900;color:#ff4757;font-variant-numeric:tabular-nums}.order-timer.received{color:#16a34a}.order-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.order-actions button{width:auto;flex:1;min-width:120px;padding:10px}.order-actions .danger{background:#8b2525;color:white}@keyframes otpPulse{70%{box-shadow:0 0 0 10px #ff475700}100%{box-shadow:0 0 0 0 #ff475700}}</style><link rel="stylesheet" href="/css/king-select-sheet.css?v=1">  <link rel="stylesheet" href="/css/page-transitions.css?v=1">

<link rel="stylesheet" href="/css/ksh-header-clean.css?v=20261022b">
<script src="/js/ksh-menu-guard.js?v=20261022b" defer></script>

</head><body><main class="wrap"><a href="/buy-number">← All number services</a><h1>Buy Number 2</h1><p class="muted">Choose a country and service, then purchase using your NGN wallet.</p><div class="panel"><div class="row"><div><label for="country">Country</label><select id="country"><option value="">Loading countries…</option></select></div><div><label for="service">Service</label><select id="service" disabled><option value="">Select a country first</option></select></div></div><div id="price" class="muted" style="margin:12px 0"></div><button id="buy" disabled>Buy Number</button><div id="notice" role="status" class="msg" style="display:none"></div></div><div class="panel"><h2>My Number Orders</h2><p class="muted">SMS updates refresh automatically while an order is waiting.</p><div id="orders">Loading orders…</div></div></main><script>
const token=()=>localStorage.getItem('ksl_token')||localStorage.getItem('token')||'';
const $=id=>document.getElementById(id);let countries=[],services=[],orders=[],timer=null,countdownTimer=null;
function money(n){return '₦'+Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token(),...(opts.headers||{})}});let d={};try{d=await r.json()}catch{}if(r.status===401){location.href='/login?next=/buy-number-2';throw Error('Please log in again.')}if(!r.ok)throw Error(d.error||'Request failed.');return d}
function notice(t){$('notice').style.display='block';$('notice').textContent=t}
async function loadCountries(){try{countries=await api('/api/numbers/n2/countries');$('country').innerHTML='<option value="">Choose country</option>'+countries.map(c=>`<option value="${esc(c.country_code)}">${esc(c.country_name)}</option>`).join('')}catch(e){$('country').innerHTML='<option value="">Could not load countries</option>';notice(e.message)}}
async function loadServices(){const c=$('country').value;$('service').disabled=true;$('service').innerHTML='<option>Loading services…</option>';if(!c){$('service').innerHTML='<option value="">Select a country first</option>';updatePrice();return}try{services=await api('/api/numbers/n2/services?country='+encodeURIComponent(c));$('service').innerHTML='<option value="">Choose service</option>'+services.map(s=>`<option value="${esc(s.id)}">${esc(s.name)} — ${money(s.sellPrice ?? s.cost)}</option>`).join('');$('service').disabled=false}catch(e){$('service').innerHTML='<option value="">Could not load services</option>';notice(e.message)}updatePrice()}
function updatePrice(){const s=services.find(x=>x.id===$('service').value);$('price').textContent=s?'Price: '+money(s.sellPrice ?? s.cost)+' (NGN).':'Choose a service to see its price.';$('buy').disabled=!s}
$('country').addEventListener('change',loadServices);$('service').addEventListener('change',updatePrice);
$('buy').addEventListener('click',async()=>{const service=services.find(x=>x.id===$('service').value);if(!service)return;const btn=$('buy');if(!(await KingUI.confirm('Buy a '+service.name+' number for '+money(service.sellPrice ?? service.cost)+'?\nThe amount will be taken from your wallet.',{title:'Confirm purchase',okText:'Buy'})))return;btn.disabled=true;btn.textContent='Purchasing…';KingUI.loading(true,'Getting your number…');try{const d=await api('/api/numbers/n2/buy',{method:'POST',body:JSON.stringify({country:$('country').value,service:service.id,clientRef:crypto.randomUUID()})});notice(d.pending?d.message:'Number purchased. Opening your Active Number card.');KingUI.banner(d.pending?d.message:'Number purchased successfully.',d.pending?'info':'success');await loadOrders();const id=d.order?.id||d.orderId;if(id){setTimeout(()=>document.getElementById('order-'+id)?.scrollIntoView({behavior:'smooth',block:'center'}),150)}}catch(e){notice(e.message);KingUI.banner(e.message,'err')}finally{KingUI.loading(false);btn.textContent='Buy Number';btn.disabled=!$('service').value}});
function renderOrders(){if(!orders.length){$('orders').innerHTML='<p class="muted">No number orders yet.</p>';return}$('orders').innerHTML=orders.map(o=>{const received=!!o.sms||['received','success','completed'].includes(String(o.status||'').toLowerCase());const closed=received||['cancelled','refunded','expired','failed'].includes(String(o.status||'').toLowerCase());const expiry=new Date(o.createdAt||Date.now()).getTime()+20*60*1000;const left=Math.max(0,Math.ceil((expiry-Date.now())/1000));const time=received?'✓ RECEIVED':String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');return `<div class="order active-order" id="order-${esc(o.id)}"><div class="order-light ${received||closed?'received':''}"><span class="led"></span><span>${received?'OTP RECEIVED':closed?esc(o.status).toUpperCase():'WAITING FOR OTP'}</span></div><div><b>${esc(o.service||'Number')} · ${esc(o.country||o.countryCode||'')}</b></div><div class="order-phone">${esc(o.number||'Waiting for provider')}</div><div>Price: <b>${money(o.price)}</b> · Status: <span class="status">${esc(o.status)}</span></div><div class="order-timer ${received||closed?'received':''}" data-countdown-id="${esc(o.id)}">${time}</div>${received?`<div class="msg" style="border:1px solid #16a34a;background:#16a34a12"><div class="muted">Your OTP code</div><div class="code" id="sms-${esc(o.id)}">${esc(o.sms)}</div><button type="button" onclick="copyValue('sms-${esc(o.id)}')" style="width:auto;padding:8px 14px">Copy OTP</button></div>`:''}<div class="order-actions"><button type="button" onclick="copyLiteral('${String(o.number||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')" ${o.number?'':'disabled'}>Copy number</button><button type="button" onclick="refreshOne('${esc(o.id)}')">Check SMS</button>${!closed&&o.canCancel?`<button class="danger" type="button" onclick="cancelOrder('${esc(o.id)}')">Cancel &amp; Refund</button>`:''}</div><div class="muted" style="margin-top:10px">Order ID: ${esc(o.orderId||o.id)} · ${new Date(o.createdAt).toLocaleString('en-NG')}</div></div>`}).join('');if(countdownTimer)clearInterval(countdownTimer);countdownTimer=setInterval(()=>{orders.forEach(o=>{if(o.sms||!['waiting','pending'].includes(String(o.status||'').toLowerCase()))return;const el=document.querySelector(`[data-countdown-id="${CSS.escape(o.id)}"]`);if(!el)return;const left=Math.max(0,Math.ceil((new Date(o.createdAt||Date.now()).getTime()+20*60*1000-Date.now())/1000));el.textContent=left<=0?'00:00':String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')})},1000)}function copyLiteral(t){navigator.clipboard?.writeText(String(t||'')).then(()=>notice('Copied to clipboard.')).catch(()=>notice('Could not copy automatically.'))}function copyValue(id){copyLiteral($(id)?.textContent||'')}
async function loadOrders(){try{orders=await api('/api/numbers/n2/orders');renderOrders();if(timer)clearInterval(timer);if(orders.some(o=>['waiting','pending'].includes(o.status)&&!o.sms))timer=setInterval(()=>orders.filter(o=>['waiting','pending'].includes(o.status)&&!o.sms).forEach(o=>refreshOne(o.id,true)),5000)}catch(e){$('orders').textContent=e.message}}
async function refreshOne(id,silent=false){try{const d=await api('/api/numbers/n2/sms/'+encodeURIComponent(id));const idx=orders.findIndex(o=>o.id===id);if(idx>=0)orders[idx]=d.order;else orders.unshift(d.order);renderOrders()}catch(e){if(!silent)notice(e.message)}}
async function cancelOrder(id){if(!confirm('Cancel this number? A refund is only issued after the provider confirms cancellation.'))return;try{const d=await api('/api/numbers/n2/cancel/'+encodeURIComponent(id),{method:'POST',body:'{}'});const i=orders.findIndex(o=>o.id===id);if(i>=0)orders[i]=d.order;renderOrders();notice('Cancellation confirmed and refund recorded.')}catch(e){notice(e.message)}}
if(!token())location.href='/login?next=/buy-number-2';else{loadCountries();loadOrders()}
</script>
