<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><title>Sign In | King Social Hub</title><link rel="icon" type="image/png" href="/favicon.png"><style>
:root{color-scheme:dark;--gold:#5ad888;--gold2:#9aeeb9;--muted:#a7a7a7}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#12331e 0,transparent 42%),linear-gradient(145deg,#080808,#101010 55%,#070707);color:#ecf7f0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;display:flex;align-items:center;justify-content:center;padding:26px 16px}.wrap{width:100%;max-width:450px}.brand{text-align:center;margin-bottom:25px}.crown{width:62px;height:62px;border:1px solid #31814e;border-radius:19px;display:grid;place-items:center;margin:0 auto 13px;background:linear-gradient(145deg,#0e301a,#111);box-shadow:0 0 40px #c19a3420;font-size:30px}.brand h1{font-size:24px;letter-spacing:2px;margin:0;font-weight:850}.brand h1 span{color:var(--gold2)}.brand p{color:var(--muted);font-size:13px;margin:8px 0}.card{border:1px solid #3b3321;background:linear-gradient(150deg,#141414f5,#0b0b0bf5);border-radius:24px;padding:29px;box-shadow:0 25px 80px #0009,0 1px 0 #ffffff08 inset}.eyebrow{font-size:10px;letter-spacing:2.3px;color:var(--gold);font-weight:800;text-transform:uppercase}.card h2{font-size:28px;margin:8px 0 7px}.intro{font-size:13px;color:var(--muted);margin:0 0 23px}.field{margin:17px 0}.field label{display:block;font-size:12px;color:#ded8c8;margin:0 0 8px;font-weight:650}.field input{width:100%;height:50px;border:1px solid #353535;background:#090909;border-radius:12px;padding:0 14px;color:#fff;outline:none;font-size:14px}.field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #d8b45a17}.field input::placeholder{color:#696969}.passwordbox{display:flex;gap:8px}.passwordbox input{flex:1;min-width:0}.toggle{background:#1b1b1b;color:var(--gold2);border:1px solid #383024;border-radius:11px;padding:0 12px;cursor:pointer}.message{display:none;margin:0 0 14px;border:1px solid #633535;background:#2a1111;color:#ffb6b6;padding:11px 12px;border-radius:10px;font-size:12px;line-height:1.5}.submit{width:100%;height:51px;border:0;border-radius:12px;background:linear-gradient(100deg,#32b562,#87ecac,#43c071);color:#06150c;font-size:14px;font-weight:850;letter-spacing:.4px;cursor:pointer;box-shadow:0 8px 25px #c39b3a20}.submit:disabled{opacity:.65;cursor:wait}.switch{text-align:center;color:#aaa;font-size:13px;margin:21px 0 0}.switch a{color:var(--gold2);text-decoration:none}.forgot{text-align:right;margin:-6px 0 19px;font-size:12px;color:var(--gold2)}.forgot a{color:inherit;text-decoration:none}.foot{text-align:center;color:#686868;font-size:10px;margin:18px 0 0;letter-spacing:.6px}@media(max-width:420px){.card{padding:24px 20px;border-radius:20px}.card h2{font-size:25px}.brand h1{font-size:21px}}
</style>  <link rel="stylesheet" href="/css/page-transitions.css?v=1">

<link rel="stylesheet" href="/css/responsive-device-fit.css?v=1">
<link rel="stylesheet" href="/css/ksh-ui-fixes.css?v=20261022c">
</head><body><main class="wrap"><header class="brand"><div class="crown">♛</div><h1>KING <span>SOCIAL HUB</span></h1><p>Your premium digital services hub.</p></header><section class="card"><div class="eyebrow">Welcome back</div><h2>Sign in to your account</h2><p class="intro">Access your wallet, purchases and services.</p><div id="message" class="message" role="alert"></div><form id="loginForm" novalidate><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" maxlength="254" required></div><div class="field"><label for="password">Password</label><div class="passwordbox"><input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button class="toggle" type="button" id="toggle">Show</button></div></div><div class="forgot"><a href="/support.html">Need help signing in?</a></div><button id="submit" class="submit" type="submit">SIGN IN&nbsp; →</button></form><p class="switch">New to King Social Hub? <a href="/register">Create an account</a></p></section><p class="foot">KING SOCIAL HUB · SECURE ACCOUNT ACCESS</p></main><script>
const form=document.getElementById('loginForm'),msg=document.getElementById('message'),submit=document.getElementById('submit');document.getElementById('toggle').addEventListener('click',()=>{const p=document.getElementById('password');p.type=p.type==='password'?'text':'password';document.getElementById('toggle').textContent=p.type==='password'?'Show':'Hide'});form.addEventListener('submit',async e=>{e.preventDefault();msg.style.display='none';const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return show('Please enter a valid email address.');if(!password)return show('Please enter your password.');submit.disabled=true;submit.textContent='SIGNING IN…';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Unable to sign in.');if(!data.token)throw new Error('Sign-in token was not returned. Please try again.');localStorage.setItem('ksl_token',data.token);localStorage.setItem('kls_token',data.token);localStorage.setItem('token',data.token);if(data.user){localStorage.setItem('ksl_user',JSON.stringify(data.user));localStorage.setItem('kls_user',JSON.stringify(data.user))}location.href='/dashboard.html'}catch(err){show(err.message||'Connection error. Please try again.')}finally{submit.disabled=false;submit.textContent='SIGN IN  →'}});function show(text){msg.textContent=text;msg.style.display='block'}
</script>  <script src="/js/page-transitions.js?v=1" defer></script>
<script src="/js/loader-failsafe.js?v=1" defer></script>
</body></html>
