<!doctype html><html lang="en"><head>
<link rel="icon" type="image/png" href="/favicon.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Boost 2 | King Social Hub</title>
<link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/brand.css">
<script src="/js/king-ui.js?v=1"></script>
<script>(function(){try{if(!localStorage.getItem('ksl_token')&&!localStorage.getItem('token'))location.replace('/login')}catch(e){}})();</script>
<style>
body{background:#0b0d11;color:#f3f5f8;padding:18px}.wrap{max-width:900px;margin:20px auto}.muted{color:#a2aab6}.back{color:#9fb4c8;text-decoration:none;font-weight:700}
.panel{background:#171a20;border:1px solid #282e38;border-radius:16px;padding:16px;margin:14px 0}
input{width:100%;padding:13px;border-radius:10px;background:#101319;color:#fff;border:1px solid #343c49;margin:6px 0;box-sizing:border-box;font-size:16px}
label{display:block;margin-top:10px;color:#b7c0cd;font-size:14px}
.btn{border:0;border-radius:10px;background:#68a9d5;color:#07121c;font-weight:800;padding:13px 16px;cursor:pointer;width:100%;font-size:16px;margin-top:12px}.btn:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:#171a20;border:1px solid #282e38;border-radius:14px;padding:16px 10px;cursor:pointer;color:inherit;text-decoration:none;font-weight:800}
.tile:hover{border-color:#68a9d5}.tile small{color:#a2aab6;font-weight:600}
.big{width:52px;height:52px;border-radius:14px;object-fit:contain;background:#fff;padding:5px}.ph{width:52px;height:52px;border-radius:14px;background:#252c38;display:grid;place-items:center;font-size:24px;font-weight:900;color:#9fb4c8}
.svc{display:flex;gap:12px;align-items:center;background:#171a20;border:1px solid #282e38;border-radius:14px;padding:12px;margin:8px 0;cursor:pointer;color:inherit;text-decoration:none}
.svc:hover{border-color:#68a9d5}.svc .big,.svc .ph{width:42px;height:42px;flex:0 0 42px;font-size:19px;border-radius:11px;padding:4px}
.svc b{display:block;line-height:1.3}.svc .m{font-size:12px;color:#a2aab6}.svc .p{margin-left:auto;text-align:right;color:#7db8e0;font-weight:800;white-space:nowrap}
.price{color:#7db8e0;font-weight:800;font-size:20px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ord{padding:10px 0;border-top:1px solid #282e38;font-size:14px}.ord:first-child{border-top:0}
@media(max-width:560px){.row{grid-template-columns:1fr}}
</style>
<link rel="stylesheet" href="/css/page-transitions.css?v=1"><link rel="stylesheet" href="/css/responsive-device-fit.css?v=1">
<link rel="stylesheet" href="/css/ksh-header-clean.css?v=20261022b">
<script src="/js/ksh-menu-guard.js?v=20261022b" defer></script>
</head><body>
<main class="wrap"><a class="back" href="/boost" id="backLink">← Back</a>
<h1 id="ttl">Boost 2</h1><p class="muted" id="sub">Choose a category.</p>
<input id="search" placeholder="Search…" autocomplete="off">
<div id="view" class="panel muted">Loading services…</div>
<div class="panel" id="ordersBox" style="display:none"><h3 style="margin:0 0 6px">Recent orders</h3><div id="orders"></div></div>
</main>
<script>
const $=id=>document.getElementById(id);
const money=n=>'₦'+Number(n||0).toLocaleString('en-NG',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt={}){const t=localStorage.getItem('ksl_token')||localStorage.getItem('token')||'';const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(t?{Authorization:'Bearer '+t}:{}),...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||d.message||'Request failed');e.status=r.status;e.data=d;throw e}return d}
function logoOf(s){return s.logo||(window.KingUI&&KingUI.logoFor((s.name||'')+' '+(s.category||'')))||''}
function logoHtml(url,text,cls){return url?'<img class="'+(cls||'big')+'" src="'+esc(url)+'" alt="" loading="lazy" onerror="this.outerHTML=\'<div class=ph>'+esc((text||'?').trim().charAt(0).toUpperCase())+'</div>\'">':'<div class="ph">'+esc((text||'?').trim().charAt(0).toUpperCase())+'</div>'}

let all=[],loaded=false;
const catOf=s=>s.category||'Other';
function route(){const h=decodeURIComponent((location.hash||'').replace(/^#/,''));return h.startsWith('cat=')?h.slice(4):''}
function render(){
  const q=$('search').value.trim().toLowerCase(),cat=route(),v=$('view');
  if(!loaded)return;
  if(!all.length){v.className='panel muted';v.textContent='No services are available right now. Please check back soon.';return}
  v.className='';
  if(!cat){
    $('ttl').textContent='Boost 2';$('sub').textContent='Choose a category.';$('backLink').href='/boost';
    const m=new Map();all.forEach(s=>{const c=catOf(s);if(!m.has(c))m.set(c,{n:0,s});m.get(c).n++});
    let rows=[...m.entries()].filter(([c])=>!q||c.toLowerCase().includes(q)).sort((a,b)=>a[0].localeCompare(b[0]));
    v.innerHTML=rows.length?'<div class="grid">'+rows.map(([c,x])=>'<a class="tile" href="#cat='+encodeURIComponent(c)+'">'+logoHtml(logoOf({name:c,category:c,logo:x.s.logo}),c)+'<span>'+esc(c)+'</span><small>'+x.n+' service'+(x.n>1?'s':'')+'</small></a>').join('')+'</div>':'<div class="panel muted">No categories match your search.</div>';
  }else{
    $('ttl').textContent=cat;$('sub').textContent='Choose a service.';$('backLink').href='#';
    let rows=all.filter(s=>catOf(s)===cat&&(!q||s.name.toLowerCase().includes(q))).sort((a,b)=>a.price-b.price);
    v.innerHTML=rows.length?rows.map(s=>'<a class="svc" href="/boost2/order" data-k="'+esc(s.serviceKey)+'" onclick="pickSvc(this)">'+logoHtml(logoOf(s),s.name,'big')+'<div><b>'+esc(s.name)+'</b><span class="m">Min '+s.min.toLocaleString()+' · Max '+s.max.toLocaleString()+'</span></div><div class="p">'+money(s.price)+'<div class="m">per 1,000</div></div></a>').join(''):'<div class="panel muted">No services match your search.</div>';
  }
}
$('backLink').addEventListener('click',e=>{if(route()){e.preventDefault();location.hash=''}});
$('search').addEventListener('input',render);window.addEventListener('hashchange',()=>{$('search').value='';render()});
async function load(){
  try{await (window.KingUI&&KingUI.logos());const d=await api('/api/boost2/services');all=(d.services||[]).map(s=>({...s,price:Number(s.price)||0}));window.__b2rows=all;loaded=true;render();if(d.enabled===false){$('view').className='panel muted';$('view').textContent=d.message||'Not available yet.'}}
  catch(e){loaded=true;$('view').className='panel muted';$('view').textContent=e.message||'Could not load services.';KingUI.banner(e.message||'Could not load services.','err')}
}
function pickSvc(a){try{const k=a.getAttribute('data-k');const r=(window.__b2rows||[]).find(x=>x.serviceKey===k);if(r)sessionStorage.setItem('b2svc',JSON.stringify(r));}catch(e){}}
async function loadOrders(){try{const rows=await api('/api/boost2/orders');if(!rows.length)return;$('ordersBox').style.display='block';$('orders').innerHTML=rows.map(o=>'<div class="ord"><b>'+esc(o.service)+'</b><br><span class="muted">'+Number(o.quantity).toLocaleString()+' · '+money(o.total)+' · '+esc(o.status)+' · '+new Date(o.createdAt).toLocaleString()+'</span></div>').join('')}catch(e){}}
load();loadOrders();
</script>
<script src="/js/app-shell.js?v=3" defer></script><script src="/js/section-tabs.js?v=1" defer></script>
<script src="/js/page-transitions.js?v=1" defer></script><script src="/js/loader-failsafe.js?v=1" defer></script>
</body></html>
