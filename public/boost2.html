<!doctype html><html lang="en"><head>
  <link rel="icon" type="image/png" href="/favicon.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMM Boosting 2 | King Social Hub</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/brand.css"><style>body{background:#0b0d11;color:#f3f5f8;padding:18px}.wrap{max-width:980px;margin:24px auto}.panel,.item{background:#171a20;border:1px solid #282e38;border-radius:16px;padding:16px;margin:12px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,select{width:100%;padding:13px;border-radius:10px;background:#101319;color:white;border:1px solid #343c49;margin:7px 0;box-sizing:border-box}button,.btn{border:0;border-radius:10px;background:#68a9d5;color:#07121c;font-weight:800;padding:12px 16px;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.price{color:#7db8e0;font-weight:800}.muted{color:#a2aab6}.notice{padding:10px;border-radius:8px;background:#202833;margin:10px 0;white-space:pre-wrap}.step{display:inline-block;background:#68a9d5;color:#07121c;border-radius:50%;width:24px;height:24px;line-height:24px;text-align:center;font-weight:800;margin-right:8px}.hidden{display:none}.summary{background:#101319;border:1px solid #343c49;border-radius:12px;padding:12px;margin:10px 0}.summary p{margin:4px 0}.cats{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.cats button{background:#202833;color:#f3f5f8;border:1px solid #343c49}.cats button.on{background:#68a9d5;color:#07121c}.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(7,18,28,.3);border-top-color:#07121c;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes sp{to{transform:rotate(360deg)}}@media(max-width:600px){.row{grid-template-columns:1fr}}</style><link rel="stylesheet" href="/css/promo-notifications.css?v=1"><link rel="stylesheet" href="/css/announce.css?v=3"><script src="/js/kls-ui.js?v=2"></script>  <link rel="stylesheet" href="/css/page-transitions.css?v=1">

<link rel="stylesheet" href="/css/responsive-device-fit.css?v=1">
</head><body><main class="wrap">
<a href="/dashboard">← Dashboard</a>
<h1>SMM Boosting 2</h1>
<p class="muted">Social media services · prices in Nigerian Naira (₦)</p>

<div class="panel">
  <div id="notice" class="notice">Loading services…</div>
  <h2><span class="step">1</span>Choose a category</h2>
  <div id="cats" class="cats"></div>
  <button id="refresh" type="button">Refresh services</button>
</div>

<div class="panel hidden" id="svcPanel">
  <h2><span class="step">2</span>Choose a service</h2>
  <input id="search" placeholder="Search within this category…">
  <select id="svc" size="1"></select>
  <p id="svcInfo" class="muted"></p>
</div>

<form class="panel hidden" id="orderForm" autocomplete="off">
  <h2><span class="step">3</span>Order details</h2>
  <div id="selected" class="price"></div>
  <label for="link">Public post / profile / video link</label>
  <input id="link" type="url" placeholder="https://…" required>
  <div class="row">
    <div><label for="qty">Quantity</label><input id="qty" type="number" step="1" inputmode="numeric" required><small id="qtyHint" class="muted"></small></div>
    <div><label>Total</label><p id="total" class="price">₦0</p></div>
  </div>
  <button id="buy" type="submit" disabled>Review &amp; place order</button>
  <p id="after" class="muted hidden"><a href="/boost-history">View my order history →</a></p>
</form>
</main>
<script>
const $ = id => document.getElementById(id);
let all = [], cat = '', chosen = null, busy = false, lockUntil = 0;
const money = n => '₦' + Number(n || 0).toLocaleString('en-NG', { maximumFractionDigits: 2 });
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const say = (msg, type, opt) => { if (window.KLS) KLS.banner(msg, type || 'info', opt || {}); else alert(msg); };
// Rate is per 1,000 units (matches lib/boost2.js: price * quantity / 1000).
const totalFor = (s, q) => Math.round((s.price * q / 1000) * 100) / 100;

async function api(url, opt = {}, timeoutMs = 45000) {
  const token = localStorage.getItem('ksl_token') || localStorage.getItem('token') || '';
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), timeoutMs);
  try {
    const r = await fetch(url, { ...opt, signal: ctl.signal, headers: { 'Content-Type':'application/json', ...(token ? { Authorization:'Bearer ' + token } : {}), ...(opt.headers || {}) } });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(data.error || data.message || 'Request failed'); e.status = r.status; throw e; }
    data._status = r.status; return data;
  } catch (e) { if (e.name === 'AbortError') { const x = new Error('timeout'); x.timeout = true; throw x; } throw e; }
  finally { clearTimeout(t); }
}

function categories() { return [...new Set(all.map(s => s.category || 'Other'))].sort((a, b) => a.localeCompare(b)); }
function renderCats() {
  const list = categories();
  $('cats').innerHTML = list.map(c => `<button type="button" data-c="${esc(c)}" class="${c === cat ? 'on' : ''}">${esc(c)}</button>`).join('') || '<span class="muted">No categories yet.</span>';
}
$('cats').onclick = e => { const b = e.target.closest('button[data-c]'); if (!b) return; cat = b.dataset.c; $('search').value = ''; chosen = null; renderCats(); renderServices(); showForm(); };

function renderServices() {
  $('svcPanel').classList.toggle('hidden', !cat);
  if (!cat) return;
  const q = $('search').value.toLowerCase();
  const rows = all.filter(s => (s.category || 'Other') === cat && s.name.toLowerCase().includes(q));
  $('svc').size = 1;
  $('svc').innerHTML = '<option value="">— Select a service —</option>' + rows.map(s => `<option value="${Number(s.id)}"${chosen && chosen.id === s.id ? ' selected' : ''}>${esc(s.name)} — ${money(s.price)} / 1,000</option>`).join('');
  $('svcInfo').textContent = rows.length ? `${rows.length} service(s) in ${cat}.` : 'No matching services in this category.';
}
$('search').oninput = renderServices;
$('svc').onchange = () => { chosen = all.find(s => s.id === Number($('svc').value)) || null; if (chosen) { $('qty').value = chosen.min; } showForm(); };

function showForm() {
  $('orderForm').classList.toggle('hidden', !chosen);
  if (!chosen) return;
  $('selected').textContent = `${chosen.name} · ${money(chosen.price)} per 1,000`;
  $('qty').min = chosen.min; $('qty').max = chosen.max;
  $('qtyHint').textContent = `Min ${chosen.min.toLocaleString()} · Max ${chosen.max.toLocaleString()}`;
  calc();
}
function calc() {
  const q = Number($('qty').value || 0);
  $('total').textContent = chosen && q > 0 ? money(totalFor(chosen, q)) : money(0);
  $('buy').disabled = !chosen || busy || Date.now() < lockUntil;
}
$('qty').oninput = calc;

async function load(refresh = false) {
  $('notice').textContent = 'Loading services…'; $('refresh').disabled = true;
  try {
    const data = await api('/api/boost2/services' + (refresh ? '?refresh=1' : ''));
    all = (data.services || []).map(s => ({ ...s, id: Number(s.id), min: Number(s.min) || 1, max: Number(s.max) || 100000, price: Number(s.price) || 0 }));
    $('notice').textContent = all.length ? `${all.length} services available${data.stale ? ' (cached list)' : ''}.` : (data.message || 'No services are available yet. Please check back soon.');
    if (cat && !categories().includes(cat)) { cat = ''; chosen = null; }
    if (chosen) chosen = all.find(s => s.id === chosen.id) || null;
    renderCats(); renderServices(); showForm();
  } catch (e) { $('notice').textContent = e.timeout ? 'Loading is taking too long. Please try again.' : (e.message || 'Could not load services.'); say($('notice').textContent, 'error'); }
  finally { $('refresh').disabled = false; }
}
$('refresh').onclick = () => load(true);

$('orderForm').onsubmit = async ev => {
  ev.preventDefault();
  if (busy || Date.now() < lockUntil || !chosen) return;
  const quantity = Number($('qty').value), link = $('link').value.trim();
  if (!/^https?:\/\//i.test(link)) return say('Enter a valid public http(s) link.', 'error');
  if (!Number.isInteger(quantity) || quantity < chosen.min || quantity > chosen.max) return say(`Quantity must be a whole number from ${chosen.min} to ${chosen.max}.`, 'error');
  const total = totalFor(chosen, quantity);
  const text = `Service: ${chosen.name}\nLink: ${link}\nQuantity: ${quantity.toLocaleString()}\nTotal: ${money(total)}`;
  const ok = window.kslConfirm ? await window.kslConfirm(text, { title:'Confirm your order', okText:'Place order', cancelText:'Review details' }) : window.confirm(text);
  if (!ok || busy) return;
  busy = true; $('buy').disabled = true; $('buy').innerHTML = '<span class="spin"></span>Submitting…';
  try {
    const data = await api('/api/boost2/orders', { method:'POST', body:JSON.stringify({ serviceId:chosen.id, quantity, link }) });
    if (data.pending) {
      lockUntil = Date.now() + 120000; // do not allow a second paid order while this one is being checked
      say(data.message || 'Your order is being verified. Please do not order again yet.', 'warn', { title:'Checking your order', ms:10000 });
    } else {
      const status = String(data.status || 'processing');
      const done = /^(success|completed|complete)$/i.test(status), failed = /^(failed|error|rejected)$/i.test(status);
      say(done ? `Order completed. Paid ${money(data.amountPaid)}.` : failed ? 'The order reported a problem. Check your order history before ordering again.' : `Order received and processing. Paid ${money(data.amountPaid)}.`, done ? 'success' : failed ? 'error' : 'info', { title: done ? 'Order complete' : failed ? 'Order needs attention' : 'Order submitted', ms:7000 });
      $('link').value = '';
    }
    $('after').classList.remove('hidden');
  } catch (e) {
    if (e.timeout) {
      lockUntil = Date.now() + 120000;
      say('We could not confirm the result yet. Your order may still be processing. Please check your order history before trying again.', 'warn', { title:'Checking your order', ms:10000 });
      $('after').classList.remove('hidden');
    } else say(e.message || 'Order failed.', 'error', { title:'Order not placed', ms:7000 });
  } finally { busy = false; $('buy').textContent = 'Review & place order'; calc(); setTimeout(calc, 121000); }
};
load();
</script>
<script src="/js/announcements.js?v=3"></script><script src="/js/app-shell.js?v=3" defer></script>
<script src="/js/section-tabs.js?v=1" defer></script>
  <script src="/js/page-transitions.js?v=1" defer></script>
<script src="/js/loader-failsafe.js?v=1" defer></script>
</body></html>
