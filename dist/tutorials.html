<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tutorials - King Social Hub</title><style>*{box-sizing:border-box}body{margin:0;background:#000;color:#eeeef5;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:0 0 30px}.top{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #252535}.top a{color:#22c55e;text-decoration:none;font-weight:700;font-size:14px}.top b{font-size:16px}.wrap{max-width:560px;margin:0 auto;padding:16px}.card{border:1px solid #252535;border-radius:14px;background:rgba(255,255,255,.03);padding:14px;margin-bottom:12px}.card h3{margin:0 0 8px;font-size:15px}.card p{margin:0;font-size:13.5px;line-height:1.5;opacity:.85}video,img{width:100%;border-radius:10px;margin-top:8px;display:block}.btn{display:inline-block;margin-top:10px;padding:10px 16px;border-radius:10px;background:#16a34a;color:#fff;text-decoration:none;font-weight:700;font-size:14px}</style></head><body><div class="top"><a href="/dashboard">&lsaquo; Back</a><b>Tutorials</b></div><div class="wrap"><div id="list"><div class="card"><p>Loading tutorials...</p></div></div><div class="card"><h3>Tutorials for products</h3><p>Open any product in the Marketplace and tap its Tutorial button to see how to log in.</p><a class="btn" href="/marketplace">Go to Marketplace</a></div><script>(function(){var list=document.getElementById("list");function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}fetch("/api/deposit-tutorials").then(function(r){return r.ok?r.json():[];}).then(function(d){var arr=Array.isArray(d)?d:(d&&Array.isArray(d.tutorials)?d.tutorials:Object.keys(d||{}).map(function(k){var v=d[k];if(v&&typeof v==="object"&&!v.method)v.method=k;return v;}));arr=arr.filter(function(t){return t&&typeof t==="object"&&(t.videoUrl||(t.imageUrls&&t.imageUrls.length)||t.caption);});if(!arr.length){list.innerHTML="<div class=\"card\"><h3>No tutorials yet</h3><p>Check back soon.</p></div>";return;}list.innerHTML=arr.map(function(t){var h="<div class=\"card\"><h3>"+esc(t.method||"Tutorial")+"</h3>";if(t.caption)h+="<p>"+esc(t.caption)+"</p>";if(t.videoUrl)h+="<video controls playsinline preload=\"metadata\" src=\""+esc(t.videoUrl)+"\"></video>";(t.imageUrls||[]).forEach(function(u){h+="<img loading=\"lazy\" alt=\"\" src=\""+esc(u)+"\">";});return h+"</div>";}).join("");}).catch(function(){list.innerHTML="<div class=\"card\"><p>Could not load tutorials.</p></div>";});})();</script></div><script src="/js/loader-failsafe.js?v=1" defer></script>
</body></html>
